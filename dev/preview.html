<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Graph preview</title>
    <style>
      html, body { margin: 0; max-width: 360px; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font); }
      #root { width: 360px; height: 520px; padding: 12px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; }

    <button id="toggle" type="button">Toggle light / dark</button>
    <div id="root"></div>
